      <stop offset="0" stop-color="#f7f4ff"/>
      <stop offset="1" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="line-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafbff"/>
