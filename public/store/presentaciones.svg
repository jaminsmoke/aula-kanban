    <text x="88" y="292" fill="#4b5f96" font-size="27">Tus ideas, diapositiva a diapositiva,</text>
    <text x="88" y="332" fill="#4b5f96" font-size="27">sin salir del aula</text>
    <g transform="translate(88 394)">
      <rect width="326" height="52" rx="26" fill="#ffffff" opacity=".84"/>
      <text x="24" y="34" fill="#2e438c" font-size="19" font-weight="600">Escribe · presenta · comparte</text>
    </g>
  </g>

  <g transform="translate(724 88) rotate(3 180 250)" font-family="Instrument Sans, system-ui, sans-serif">
    <rect width="360" height="500" rx="30" fill="url(#pres-card)" opacity=".97"/>
    <rect x="18" y="18" width="324" height="42" rx="14" fill="#f5f1ff" stroke="#ddd5fb" stroke-width="2"/>
    <text x="36" y="45" fill="#5b45b8" font-size="13" font-weight="700" letter-spacing="2">DIAPOSITIVAS</text>
    <circle cx="300" cy="39" r="8" fill="#5b45b8"/>
    <circle cx="318" cy="39" r="8" fill="#f5f1ff" stroke="#5b45b8" stroke-width="2"/>

    <rect x="38" y="86" width="284" height="180" rx="18" fill="#ffffff" stroke="#d9d1fa" stroke-width="3"/>
    <rect x="58" y="108" width="86" height="8" rx="4" fill="#b9adff"/>
    <text x="58" y="154" fill="#1c2a5a" font-size="24" font-weight="700">Nuestra idea</text>
    <path d="M58 170h88" stroke="#e5a62e" stroke-width="5" stroke-linecap="round"/>
    <g fill="#4b5f96" font-size="15">
