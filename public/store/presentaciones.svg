      <text x="78" y="251">Lo que hemos aprendido</text>
    </g>
    <text x="292" y="252" fill="#8d83b7" font-size="12">1 / 4</text>

    <g transform="translate(38 284)">
      <rect width="284" height="118" rx="16" fill="#f5f1ff" stroke="#ddd5fb" stroke-width="2"/>
