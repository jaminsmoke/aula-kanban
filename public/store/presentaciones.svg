<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Portada de Presentaciones">
  <defs>
    <linearGradient id="pres-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2ff"/>
      <stop offset="1" stop-color="#dcd6fb"/>
    </linearGradient>
    <linearGradient id="pres-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbf9ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#pres-bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#b7adf4" opacity=".42"/>
  <circle cx="100" cy="630" r="190" fill="#ffffff" opacity=".4"/>

  <g transform="translate(0 30)" font-family="Instrument Sans, system-ui, sans-serif">
