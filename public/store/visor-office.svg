<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Portada de Visor Office">
  <defs>
    <linearGradient id="visor-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#dfe9fa"/>
    </linearGradient>
    <linearGradient id="visor-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="visor-doc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f5fae"/>
      <stop offset="1" stop-color="#4a79c6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#visor-bg)"/>
  <circle cx="1082" cy="86" r="220" fill="#b9cdef" opacity=".44"/>
  <circle cx="84" cy="642" r="190" fill="#ffffff" opacity=".46"/>

  <g transform="translate(0 30)" font-family="Instrument Sans, system-ui, sans-serif">
    <text x="86" y="230" fill="#17284a" font-size="68" font-weight="700">Visor</text>
    <text x="86" y="300" fill="#2f5fae" font-size="68" font-weight="700">Office</text>
    <text x="88" y="360" fill="#52678c" font-size="27">Abre Word, Excel y</text>
    <text x="88" y="400" fill="#52678c" font-size="27">PowerPoint sin subirlos</text>
    <g transform="translate(88 452)">
      <rect width="350" height="52" rx="26" fill="#ffffff" opacity=".88"/>
      <text x="24" y="34" fill="#2f5fae" font-size="19" font-weight="600">Solo lectura · archivo local</text>
    </g>
  </g>

  <g transform="translate(700 78) rotate(2 220 260)" font-family="Instrument Sans, system-ui, sans-serif">
    <rect width="440" height="520" rx="30" fill="url(#visor-page)" opacity=".98"/>

    <rect x="0" y="0" width="440" height="54" rx="30" fill="#edf3fd"/>
    <rect x="0" y="30" width="440" height="24" fill="#edf3fd"/>
    <text x="30" y="34" fill="#2f5fae" font-size="12" font-weight="700" letter-spacing="1.8">VISOR OFFICE</text>
    <circle cx="396" cy="27" r="6" fill="#b7c8e8"/>
    <circle cx="414" cy="27" r="6" fill="#b7c8e8"/>

    <g transform="translate(30 76)" font-size="11" font-weight="700">
      <rect width="94" height="30" rx="15" fill="#e8f0fc"/>
      <text x="17" y="20" fill="#2f5fae">DOCX</text>
      <rect x="104" width="94" height="30" rx="15" fill="#e9f7ef"/>
      <text x="121" y="20" fill="#287a50">XLSX</text>
      <rect x="208" width="94" height="30" rx="15" fill="#fff1e6"/>
      <text x="225" y="20" fill="#a05a20">PPTX</text>
      <text x="320" y="20" fill="#6e7f9f" font-weight="500">Local</text>
    </g>

    <g transform="translate(30 128)">
      <rect width="380" height="294" rx="18" fill="#ffffff" stroke="#dce7f8" stroke-width="2"/>
      <rect x="24" y="24" width="56" height="12" rx="6" fill="#2f5fae"/>
      <text x="24" y="72" fill="#17284a" font-size="23" font-weight="700">Documento de prueba</text>
      <text x="24" y="96" fill="#7385a5" font-size="11.5">Una vista limpia, sin editar el archivo original.</text>
      <rect x="24" y="114" width="332" height="2" rx="1" fill="#e4ebf6"/>

      <g fill="#5d6f91" font-size="11.5">
        <circle cx="30" cy="139" r="2.5" fill="#2f5fae"/>
        <text x="42" y="143">Abrir documentos de Office en el aula.</text>
        <circle cx="30" cy="162" r="2.5" fill="#2f5fae"/>
        <text x="42" y="166">Mantener el archivo en el navegador.</text>
        <circle cx="30" cy="185" r="2.5" fill="#2f5fae"/>
        <text x="42" y="189">Navegar, ajustar y ampliar la vista.</text>
      </g>

      <g transform="translate(24 210)">
        <rect width="332" height="60" rx="10" fill="#f5f9ff" stroke="#dce7f8" stroke-width="1.5"/>
        <rect x="0" y="0" width="332" height="22" rx="10" fill="#2f5fae"/>
        <text x="12" y="15" fill="#ffffff" font-size="9.5" font-weight="700">FORMATO</text>
        <text x="206" y="15" fill="#ffffff" font-size="9.5" font-weight="700">ESTADO</text>
        <text x="12" y="42" fill="#4d6185" font-size="10.5">Word · Excel · PowerPoint</text>
        <text x="206" y="42" fill="#287a50" font-size="10.5" font-weight="700">Solo lectura</text>
      </g>
    </g>

    <g transform="translate(30 438)">
      <rect width="380" height="46" rx="13" fill="#f2f7ff" stroke="#dce7f8" stroke-width="1.5"/>
      <circle cx="24" cy="23" r="8" fill="#ffffff" stroke="#c8d8ef" stroke-width="1.5"/>
      <path d="M21 23h6M24 20v6" stroke="#2f5fae" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="27" fill="#52678c" font-size="10.5" font-weight="600">100 %</text>
      <circle cx="94" cy="23" r="8" fill="#ffffff" stroke="#c8d8ef" stroke-width="1.5"/>
      <path d="M91 23h6" stroke="#2f5fae" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="116" y="10" width="82" height="26" rx="13" fill="url(#visor-doc)"/>
      <text x="132" y="27" fill="#ffffff" font-size="10.5" font-weight="700">Ajustar</text>
      <text x="220" y="27" fill="#6e7f9f" font-size="10.5">Página 1 de 1</text>
    </g>
  </g>

  <g transform="translate(560 520) rotate(-5 90 90)" font-family="Instrument Sans, system-ui, sans-serif">
    <rect width="184" height="132" rx="20" fill="#ffffff" opacity=".93"/>
    <rect x="16" y="16" width="152" height="100" rx="12" fill="#f4fbf7" stroke="#d5ebde" stroke-width="2"/>
    <g fill="#cfe5d9">
      <rect x="28" y="32" width="42" height="16" rx="4"/>
      <rect x="76" y="32" width="42" height="16" rx="4"/>
      <rect x="124" y="32" width="32" height="16" rx="4"/>
      <rect x="28" y="54" width="42" height="16" rx="4"/>
      <rect x="76" y="54" width="42" height="16" rx="4"/>
      <rect x="124" y="54" width="32" height="16" rx="4"/>
      <rect x="28" y="76" width="42" height="16" rx="4"/>
      <rect x="76" y="76" width="42" height="16" rx="4"/>
      <rect x="124" y="76" width="32" height="16" rx="4"/>
    </g>
    <text x="28" y="108" fill="#287a50" font-size="10" font-weight="700">Hoja de cálculo</text>
  </g>

  <g transform="translate(570 72) rotate(6 74 74)" font-family="Instrument Sans, system-ui, sans-serif">
    <rect width="148" height="108" rx="18" fill="#ffffff" opacity=".92"/>
    <rect x="14" y="14" width="120" height="80" rx="10" fill="#fff5ec" stroke="#f0d8c3" stroke-width="2"/>
    <rect x="28" y="30" width="92" height="7" rx="3.5" fill="#e6a36c"/>
    <rect x="28" y="46" width="64" height="5" rx="2.5" fill="#efd0b5"/>
    <rect x="28" y="58" width="76" height="5" rx="2.5" fill="#efd0b5"/>
    <text x="28" y="84" fill="#a05a20" font-size="9.5" font-weight="700">Presentación</text>
  </g>
</svg>
