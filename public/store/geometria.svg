<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Portada de Geometría interactiva">
  <defs>
    <linearGradient id="geo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ff"/>
      <stop offset="1" stop-color="#d8d0ff"/>
    </linearGradient>
    <linearGradient id="geo-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#faf8ff"/>
    </linearGradient>
    <clipPath id="geo-grid-clip">
      <rect x="40" y="90" width="280" height="280" rx="18"/>
