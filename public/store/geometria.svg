    <text x="86" y="300" fill="#2e438c" font-size="68" font-weight="700">interactiva</text>
    <text x="88" y="360" fill="#4b5f96" font-size="27">Puntos, rectas y circunferencias</text>
    <text x="88" y="400" fill="#4b5f96" font-size="27">que responden al arrastre</text>
    <g transform="translate(88 452)">
