    <circle cx="318" cy="39" r="8" fill="#f5f1ff" stroke="#5b45b8" stroke-width="2"/>

    <rect x="40" y="90" width="280" height="280" rx="18" fill="#fbfaff" stroke="#d9d1fa" stroke-width="3"/>
    <g clip-path="url(#geo-grid-clip)" stroke="#e3def5" stroke-width="1.5">
      <path d="M75 90V370M110 90V370M145 90V370M180 90V370M215 90V370M250 90V370M285 90V370"/>
      <path d="M40 125H320M40 160H320M40 195H320M40 230H320M40 265H320M40 300H320M40 335H320"/>
