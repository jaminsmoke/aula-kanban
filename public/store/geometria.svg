      <circle cx="250" cy="300" r="7" fill="#7c5cff" stroke="#ffffff" stroke-width="2"/>
      <text x="260" y="327" fill="#4b3a78">B</text>
      <circle cx="150" cy="150" r="7" fill="#7c5cff" stroke="#ffffff" stroke-width="2"/>
