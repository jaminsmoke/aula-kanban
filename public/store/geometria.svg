      <path d="M180 98l-5 10h10z" fill="#9f94c9" stroke="none"/>
    </g>

    <path d="M60 300 Q180 105 300 300" fill="none" stroke="#d9688a" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <circle cx="180" cy="230" r="92" fill="#e5a62e" fill-opacity=".08" stroke="#e5a62e" stroke-width="4"/>
    <path d="M110 300 L250 300 L150 150 Z" fill="#7c5cff" fill-opacity=".08" stroke="#7c5cff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M150 150 L250 300" fill="none" stroke="#2f9e8f" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 300 L150 150" fill="none" stroke="#e5a62e" stroke-width="4" stroke-linecap="round"/>

