      <circle cx="96" cy="139" r="6" fill="#3355c8" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g>
      <rect x="208" y="95" width="112" height="44" rx="12" fill="#ffffff" stroke="#9bb6ef" stroke-width="3"/>
      <text x="264" y="123" fill="#2e438c" font-size="15" font-weight="700" text-anchor="middle">Idea</text>
      <circle cx="264" cy="139" r="6" fill="#3355c8" stroke="#ffffff" stroke-width="2"/>
