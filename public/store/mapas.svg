    <path d="M180 250 C220 200, 240 165, 264 135" fill="none" stroke="#9bb6ef" stroke-width="4" stroke-linecap="round"/>
    <path d="M180 250 C140 300, 120 335, 96 365" fill="none" stroke="#9bb6ef" stroke-width="4" stroke-linecap="round"/>
