<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Portada de Calculadora">
  <defs>
    <linearGradient id="calc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9ff"/>
      <stop offset="1" stop-color="#ddd2ff"/>
    </linearGradient>
    <linearGradient id="calc-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8ff"/>
      <stop offset="1" stop-color="#eee8ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#calc-bg)"/>
  <circle cx="1060" cy="90" r="210" fill="#c9b8ff" opacity=".45"/>
  <circle cx="120" cy="620" r="180" fill="#ffffff" opacity=".35"/>
  <g transform="translate(0 50)" font-family="Instrument Sans, system-ui, sans-serif">
    <text x="86" y="250" fill="#2b1d52" font-size="66" font-weight="700">Calculadora</text>
    <text x="88" y="306" fill="#5a4a80" font-size="28">Básica, científica y ecuaciones</text>
    <text x="88" y="352" fill="#5a4a80" font-size="28">con memoria e historial</text>
    <g transform="translate(88 408)">
      <rect width="250" height="52" rx="26" fill="#ffffff" opacity=".8"/>
      <text x="24" y="34" fill="#4b3a78" font-size="20" font-weight="600">Alt + 1 · 2 + 2 = 4</text>
    </g>
  </g>
  <g transform="translate(748 78) rotate(4 180 260)" font-family="Instrument Sans, system-ui, sans-serif">
    <rect width="340" height="520" rx="34" fill="#ffffff" opacity=".96"/>
    <rect x="24" y="24" width="292" height="150" rx="20" fill="url(#calc-screen)"/>
    <text x="292" y="88" fill="#8a7aab" font-size="24" text-anchor="end">2 + 2</text>
    <text x="292" y="148" fill="#2b1d52" font-size="56" font-weight="700" text-anchor="end">4</text>
    <g fill="#f5f1ff" stroke="#ddd3fa" stroke-width="2">
      <rect x="24" y="196" width="64" height="48" rx="12"/><rect x="100" y="196" width="64" height="48" rx="12"/>
      <rect x="176" y="196" width="64" height="48" rx="12"/><rect x="252" y="196" width="64" height="48" rx="12"/>
      <rect x="24" y="256" width="64" height="48" rx="12"/><rect x="100" y="256" width="64" height="48" rx="12"/>
      <rect x="176" y="256" width="64" height="48" rx="12"/><rect x="252" y="256" width="64" height="48" rx="12"/>
      <rect x="24" y="316" width="64" height="48" rx="12"/><rect x="100" y="316" width="64" height="48" rx="12"/>
      <rect x="176" y="316" width="64" height="48" rx="12"/><rect x="252" y="316" width="64" height="48" rx="12"/>
      <rect x="24" y="376" width="64" height="48" rx="12"/><rect x="100" y="376" width="64" height="48" rx="12"/>
      <rect x="176" y="376" width="64" height="48" rx="12"/><rect x="252" y="376" width="64" height="48" rx="12"/>
    </g>
    <g fill="#3c2a66" font-size="23" font-weight="600" text-anchor="middle">
      <text x="56" y="228">7</text><text x="132" y="228">8</text><text x="208" y="228">9</text><text x="284" y="228">÷</text>
      <text x="56" y="288">4</text><text x="132" y="288">5</text><text x="208" y="288">6</text><text x="284" y="288">×</text>
      <text x="56" y="348">1</text><text x="132" y="348">2</text><text x="208" y="348">3</text><text x="284" y="348">−</text>
      <text x="56" y="408">0</text><text x="132" y="408">.</text><text x="208" y="408">±</text><text x="284" y="408">+</text>
    </g>
    <rect x="24" y="444" width="292" height="52" rx="14" fill="#6b4fd8"/>
    <text x="170" y="478" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">=</text>
  </g>
</svg>
