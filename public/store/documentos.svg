<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Portada de Notas y documentos">
  <defs>
    <linearGradient id="docs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#e8ddf4"/>
    </linearGradient>
    <linearGradient id="docs-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fcfaff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#docs-bg)"/>
  <circle cx="1090" cy="92" r="210" fill="#cfbfea" opacity=".52"/>
  <circle cx="92" cy="640" r="190" fill="#ffffff" opacity=".45"/>

  <g transform="translate(0 30)" font-family="Instrument Sans, system-ui, sans-serif">
    <text x="86" y="230" fill="#2d214d" font-size="68" font-weight="700">Notas y</text>
    <text x="86" y="300" fill="#59458d" font-size="68" font-weight="700">documentos</text>
    <text x="88" y="360" fill="#6f628e" font-size="27">Escribe, organiza</text>
    <text x="88" y="400" fill="#6f628e" font-size="27">y comparte ideas</text>
    <g transform="translate(88 452)">
      <rect width="354" height="52" rx="26" fill="#ffffff" opacity=".86"/>
      <text x="24" y="34" fill="#59458d" font-size="19" font-weight="600">Edita · guarda · exporta</text>
    </g>
  </g>

  <g transform="translate(696 74) rotate(3 200 260)" font-family="Instrument Sans, system-ui, sans-serif">
    <rect width="412" height="526" rx="28" fill="url(#docs-sheet)" opacity=".98"/>
    <rect x="28" y="24" width="356" height="34" rx="10" fill="#f3edfb"/>
    <text x="44" y="46" fill="#59458d" font-size="11.5" font-weight="700" letter-spacing="1.4">NOTAS Y DOCUMENTOS</text>
    <circle cx="354" cy="41" r="7" fill="#7557bd"/>
    <circle cx="372" cy="41" r="7" fill="#ffffff" stroke="#7557bd" stroke-width="2"/>

    <text x="44" y="106" fill="#2d214d" font-size="24" font-weight="700">Ideas para la semana</text>
    <rect x="44" y="122" width="324" height="2" rx="1" fill="#e2d8f2"/>

    <text x="44" y="160" fill="#4d4169" font-size="13" font-weight="700">Plan de trabajo</text>
    <g fill="#766a91" font-size="11.5">
      <circle cx="51" cy="180" r="2.5" fill="#7557bd"/>
      <text x="62" y="184">Preparar el material de clase.</text>
      <circle cx="51" cy="201" r="2.5" fill="#7557bd"/>
      <text x="62" y="205">Revisar las dudas del equipo.</text>
      <circle cx="51" cy="222" r="2.5" fill="#7557bd"/>
      <text x="62" y="226">Dejar una conclusión escrita.</text>
    </g>

    <rect x="44" y="248" width="324" height="60" rx="9" fill="#f7f1fd"/>
    <rect x="44" y="248" width="4" height="60" rx="2" fill="#7557bd"/>
    <text x="60" y="272" fill="#675686" font-size="11.5" font-style="italic">Una nota clara se entiende</text>
    <text x="60" y="291" fill="#675686" font-size="11.5" font-style="italic">sin preguntar de nuevo.</text>

    <text x="44" y="342" fill="#4d4169" font-size="13" font-weight="700">Enlaces y código</text>
    <text x="44" y="365" fill="#766a91" font-size="11.5">Puedes enlazar una </text>
    <text x="146" y="365" fill="#7557bd" font-size="11.5" font-weight="700" text-decoration="underline">fuente fiable</text>
    <text x="225" y="365" fill="#766a91" font-size="11.5"> o guardar una idea.</text>

    <rect x="44" y="386" width="324" height="54" rx="9" fill="#342a4e"/>
    <text x="61" y="410" fill="#f2eaf9" font-size="10.5" font-family="ui-monospace, Consolas, monospace">const idea = "escribir y compartir";</text>

    <rect x="44" y="462" width="188" height="34" rx="17" fill="#7557bd"/>
    <text x="64" y="484" fill="#ffffff" font-size="12" font-weight="700">Guardar documento</text>
    <path d="M264 470l7 7-7 7" fill="none" stroke="#7557bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="484" fill="#6f628e" font-size="11.5">Exportar HTML</text>
  </g>
</svg>
