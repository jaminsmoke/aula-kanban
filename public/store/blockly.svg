<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Portada de Programación por bloques">
  <defs>
    <linearGradient id="bl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7e6"/>
      <stop offset="1" stop-color="#d3edcc"/>
    </linearGradient>
    <linearGradient id="bl-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6fcf4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bl-bg)"/>
  <circle cx="1080" cy="90" r="210" fill="#b3e3c2" opacity=".5"/>
  <circle cx="110" cy="620" r="180" fill="#ffffff" opacity=".38"/>
  <g font-family="Instrument Sans, system-ui, sans-serif">
    <text x="86" y="250" fill="#23421d" font-size="66" font-weight="700">Programación</text>
    <text x="88" y="306" fill="#456b3c" font-size="28">por bloques, paso a paso</text>
    <text x="88" y="352" fill="#456b3c" font-size="28">JavaScript y Python</text>
    <g transform="translate(88 408)">
      <rect width="300" height="52" rx="26" fill="#ffffff" opacity=".82"/>
      <text x="24" y="34" fill="#2f5c2b" font-size="20" font-weight="600">Arrastra, conecta y prueba</text>
    </g>
  </g>
  <g transform="translate(720 88) rotate(-3 180 250)" font-family="Instrument Sans, system-ui, sans-serif">
    <rect width="360" height="500" rx="30" fill="url(#bl-card)" opacity=".97"/>
    <rect x="18" y="18" width="324" height="42" rx="14" fill="#f0f9f1" stroke="#d5ebd8" stroke-width="2"/>
    <g>
      <rect x="34" y="30" width="12" height="18" rx="3" fill="#4a9b5c"/>
      <rect x="52" y="30" width="12" height="18" rx="3" fill="#7cbf77"/>
      <rect x="70" y="30" width="12" height="18" rx="3" fill="#b7d98e"/>
      <text x="94" y="44" fill="#3d6b40" font-size="13" font-weight="700" letter-spacing="2">BLOQUES</text>
      <circle cx="316" cy="39" r="13" fill="#4a9b5c"/>
      <path d="M312 33 l9 6 -9 6z" fill="#ffffff"/>
    </g>
    <g>
      <rect x="44" y="98" width="270" height="54" rx="12" fill="#4a9b5c"/>
      <rect x="110" y="152" width="32" height="10" rx="5" fill="#4a9b5c"/>
      <text x="66" y="132" fill="#ffffff" font-size="22" font-weight="700">imprimir «¡Hola!»</text>
    </g>
    <g>
      <rect x="44" y="174" width="280" height="70" rx="12" fill="#3f8b52"/>
      <rect x="110" y="244" width="32" height="10" rx="5" fill="#3f8b52"/>
      <text x="66" y="205" fill="#ffffff" font-size="22" font-weight="700">repetir</text>
      <text x="66" y="232" fill="#e6f6e4" font-size="18">3 veces</text>
    </g>
    <g>
      <rect x="68" y="254" width="232" height="52" rx="12" fill="#5aa86b"/>
      <text x="88" y="286" fill="#ffffff" font-size="21" font-weight="700">imprimir «Hola»</text>
    </g>
    <g>
      <rect x="44" y="318" width="220" height="52" rx="12" fill="#2f7a45"/>
      <text x="66" y="350" fill="#ffffff" font-size="21" font-weight="700">mover 10 pasos</text>
    </g>
    <rect x="44" y="392" width="272" height="72" rx="14" fill="#f1faf1" stroke="#cfe8d3" stroke-width="2"/>
    <text x="62" y="420" fill="#2f6b3c" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">for (let i = 0; i &lt; 3; i++)</text>
    <text x="62" y="444" fill="#5b8a63" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  console.log("¡Hola!")</text>
  </g>
</svg>
