    <g transform="translate(30 438)">
      <rect width="380" height="46" rx="13" fill="#f4f1fd" stroke="#e0d8f2" stroke-width="1.5"/>
      <text x="20" y="27" fill="#786d92" font-size="10.5" font-weight="600">Un documento, tres formas de leerlo</text>
      <rect x="270" y="10" width="92" height="26" rx="13" fill="url(#aula-action)"/>
      <text x="288" y="27" fill="#ffffff" font-size="10.5" font-weight="700">Presentar</text>
    </g>
  </g>
