name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "AGENTS.md"
      - "**/*.md"
      - ".freebuff/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "AGENTS.md"
      - "**/*.md"
      - ".freebuff/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run arch:check
      - run: npm run dead:check
      - run: npm run app:budget
      - run: npm test
      - run: npm run build
      - run: npm run perf:budget
